name: Deploy NestBalance Homologation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_NESTBALANCE_HOMOLOG to redeploy main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestbalance-homologation
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm == 'DEPLOY_NESTBALANCE_HOMOLOG'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GCP_PROJECT_ID: millionsnest
      GCP_PROJECT_NUMBER: "555464791734"
      GCP_REGION: us-central1
      GCP_ARTIFACT_REGISTRY: millionsnest-web
      NESTBALANCE_API_IMAGE: us-central1-docker.pkg.dev/millionsnest/millionsnest-web/nestbalance-api:${{ github.sha }}
      GCP_WIF_PROVIDER: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
      GCP_DEPLOY_SERVICE_ACCOUNT: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      NESTBALANCE_RUNTIME_SERVICE_ACCOUNT: nestbalance-runtime@millionsnest.iam.gserviceaccount.com
      FIREBASE_HOSTING_SITE: mn-nb-homol-555464791734
      FIREBASE_STORAGE_BUCKET: millionsnest.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: millionsnest.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: millionsnest
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:555464791734:web:3059e8ac2b8089a1767817
      OPENAI_SECRET_NAME: ${{ vars.OPENAI_SECRET_NAME }}
      OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL }}
      OPENAI_TRANSCRIBE_MODEL: ${{ vars.OPENAI_TRANSCRIBE_MODEL }}
      GEMINI_SECRET_NAME: ${{ vars.GEMINI_SECRET_NAME }}
      NESTBALANCE_ENABLE_GEMINI_FREE: ${{ vars.NESTBALANCE_ENABLE_GEMINI_FREE }}
      NESTBALANCE_GEMINI_FREE_PROJECT_CONFIRMED: ${{ vars.NESTBALANCE_GEMINI_FREE_PROJECT_CONFIRMED }}
      NESTBALANCE_GEMINI_FREE_DAILY_CAP: ${{ vars.NESTBALANCE_GEMINI_FREE_DAILY_CAP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deployment preflight
        run: npm run deploy:preflight

      - name: Validate application
        run: |
          npm run check
          npm run typecheck
          npm run build
          npm run build:cloudrun

      - name: Authenticate to MillionsNest GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Runtime IAM boundary
        run: echo "NestBalance runtime identity and IAM are centrally bootstrapped by MillionsNest infrastructure."

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build NestBalance API image
        run: docker build -t "$NESTBALANCE_API_IMAGE" .

      - name: Local API container smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name nestbalance-api-smoke \
            -e PORT=8080 \
            -e FIREBASE_PROJECT_ID="$GCP_PROJECT_ID" \
            -e FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            -p 18083:8080 "$NESTBALANCE_API_IMAGE"
          trap 'docker stop nestbalance-api-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18083/healthz | grep -q '"ok":true'; then
              echo "NESTBALANCE_CONTAINER_SMOKE_OK"
              exit 0
            fi
            sleep 1
          done
          docker logs nestbalance-api-smoke
          exit 1

      - name: Push NestBalance API image
        run: docker push "$NESTBALANCE_API_IMAGE"

      - name: Deploy NestBalance API
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          SECRET_MAPPINGS=()
          if [[ -n "${OPENAI_SECRET_NAME:-}" ]]; then
            SECRET_MAPPINGS+=("OPENAI_API_KEY=${OPENAI_SECRET_NAME}:latest")
          fi
          if [[ -n "${GEMINI_SECRET_NAME:-}" ]]; then
            SECRET_MAPPINGS+=("GEMINI_API_KEY=${GEMINI_SECRET_NAME}:latest")
          fi
          if (( ${#SECRET_MAPPINGS[@]} > 0 )); then
            IFS=,
            EXTRA_ARGS+=(--set-secrets "${SECRET_MAPPINGS[*]}")
            unset IFS
          fi

          gcloud run deploy nestbalance-api \
            --image "$NESTBALANCE_API_IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$NESTBALANCE_RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 8 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 60 \
            --set-env-vars "FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET,OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-5.6-luna},OPENAI_TRANSCRIBE_MODEL=${OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe},NESTBALANCE_ENABLE_GEMINI_FREE=${NESTBALANCE_ENABLE_GEMINI_FREE:-false},NESTBALANCE_GEMINI_FREE_PROJECT_CONFIRMED=${NESTBALANCE_GEMINI_FREE_PROJECT_CONFIRMED:-false},NESTBALANCE_GEMINI_FREE_DAILY_CAP=${NESTBALANCE_GEMINI_FREE_DAILY_CAP:-100}" \
            "${EXTRA_ARGS[@]}"

      - name: Ensure dedicated Firebase Hosting site
        shell: bash
        run: |
          set -euo pipefail
          npx firebase hosting:sites:list --project "$GCP_PROJECT_ID" --json > /tmp/hosting-sites.json
          if ! grep -Fq "$FIREBASE_HOSTING_SITE" /tmp/hosting-sites.json; then
            npx firebase hosting:sites:create "$FIREBASE_HOSTING_SITE" --project "$GCP_PROJECT_ID"
          fi
          npx firebase target:apply hosting nestbalance-homologation "$FIREBASE_HOSTING_SITE" --project "$GCP_PROJECT_ID"

      - name: Preserve and authorize NestBalance Firebase Auth domain
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HOST="$FIREBASE_HOSTING_SITE.web.app"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          CONFIG_URL="https://identitytoolkit.googleapis.com/admin/v2/projects/$GCP_PROJECT_ID/config"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$CONFIG_URL" > /tmp/firebase-auth-config.json

          jq --arg domain "$AUTH_HOST" \
            '{authorizedDomains: (((.authorizedDomains // []) + [$domain]) | unique)}' \
            /tmp/firebase-auth-config.json > /tmp/firebase-auth-patch.json

          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/firebase-auth-patch.json \
            "$CONFIG_URL?updateMask=authorizedDomains" >/tmp/firebase-auth-updated.json

          jq -e --arg domain "$AUTH_HOST" '.authorizedDomains | index($domain) != null' \
            /tmp/firebase-auth-updated.json >/dev/null

      - name: Deploy NestBalance Hosting only
        run: npx firebase deploy --only hosting:nestbalance-homologation --project "$GCP_PROJECT_ID"

      - name: Smoke check public Hosting and API rewrite
        shell: bash
        run: |
          set -euo pipefail
          API_URL="$(gcloud run services describe nestbalance-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$API_URL"

          HOSTING_URL="https://$FIREBASE_HOSTING_SITE.web.app"

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            "$HOSTING_URL/api/healthz" | grep -q '"ok":true'

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            "$HOSTING_URL/" | grep -q 'NestBalance'

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            "$HOSTING_URL/sw.js" | grep -Fq "url.pathname.startsWith('/api/')"
          curl --fail --silent --show-error --head "$HOSTING_URL/sw.js" \
            | tr -d '\r' | grep -Eqi '^cache-control:.*no-store'

          DIRECT_API_STATUS="$(curl --silent --show-error --location -o /tmp/nestbalance-direct-health.json -w '%{http_code}' "$API_URL/healthz" || true)"
          echo "NESTBALANCE_DIRECT_API_STATUS=$DIRECT_API_STATUS"
          echo "NESTBALANCE_API_URL=$API_URL"
          echo "NESTBALANCE_HOMOLOG_URL=$HOSTING_URL"
