name: NestBalance Browser Quality

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestbalance-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build exported web app
        env:
          NEXT_PUBLIC_NESTBALANCE_E2E_MODE: "1"
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile desktop accessibility smoke
        run: npm run test:e2e

      - name: Upload authenticated screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestbalance-browser-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
