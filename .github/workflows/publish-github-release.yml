name: Publish NestBalance GitHub Release

on:
  workflow_run:
    workflows:
      - Deploy NestBalance Production
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: nestbalance-github-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout certified production SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Resolve stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "Stable GitHub Release skipped for prerelease version: $VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require successful official-site publication for the same SHA
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NESTBALANCE_CERTIFIED_DEPLOY_RUN=${{ github.event.workflow_run.id }}"
          OFFICIAL_RUN_ID=""
          for i in {1..60}; do
            OFFICIAL_RUN_ID="$(gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/workflows/publish-official-production.yml/runs?branch=production&event=push&per_page=20"               | jq -r --arg sha "$RELEASE_SHA" '.workflow_runs[] | select(.head_sha==$sha and .conclusion=="success") | .id'               | head -n 1)"
            if [[ -n "$OFFICIAL_RUN_ID" ]]; then
              break
            fi
            sleep 10
          done
          test -n "$OFFICIAL_RUN_ID"
          echo "NESTBALANCE_CERTIFIED_OFFICIAL_SITE_RUN=$OFFICIAL_RUN_ID"

      - name: Create stable tag and GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "NestBalance $VERSION" \
            --notes-file docs/RELEASE_1.1.md \
            --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url

      - name: Verify tag resolves to certified production SHA
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          test "$TAG_SHA" = "$RELEASE_SHA"
          echo "NESTBALANCE_RELEASE_TAG=$TAG"
          echo "NESTBALANCE_RELEASE_SHA=$TAG_SHA"
