name: Deploy NestBalance Production

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_NESTBALANCE_PRODUCTION
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestbalance-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || inputs.confirm == 'DEPLOY_NESTBALANCE_PRODUCTION')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_PROJECT_ID: millionsnest
      GCP_PROJECT_NUMBER: "555464791734"
      GCP_REGION: us-central1
      GCP_ARTIFACT_REGISTRY: millionsnest-web
      NESTBALANCE_API_SERVICE: nestbalance-api-prod
      NESTBALANCE_API_IMAGE: us-central1-docker.pkg.dev/millionsnest/millionsnest-web/nestbalance-api-prod:${{ github.sha }}
      GCP_WIF_PROVIDER: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
      GCP_DEPLOY_SERVICE_ACCOUNT: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      NESTBALANCE_RUNTIME_SERVICE_ACCOUNT: nestbalance-runtime@millionsnest.iam.gserviceaccount.com
      FIREBASE_HOSTING_SITE: mn-nb-prod-555464791734
      FIREBASE_STORAGE_BUCKET: millionsnest.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: millionsnest.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: millionsnest
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:555464791734:web:3059e8ac2b8089a1767817
      OPENAI_SECRET_NAME: ${{ vars.OPENAI_SECRET_NAME }}
      OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL }}
      OPENAI_TRANSCRIBE_MODEL: ${{ vars.OPENAI_TRANSCRIBE_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production preflight
        run: node scripts/production-preflight.mjs

      - name: Full application gates
        run: npm run check:ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser release gate
        run: npm run test:e2e

      - name: Authenticate to MillionsNest GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build production API image
        run: docker build -t "$NESTBALANCE_API_IMAGE" .

      - name: Local production image smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name nestbalance-prod-smoke             -e PORT=8080             -e NESTBALANCE_ENV=production             -e NESTBALANCE_RELEASE_SHA="${GITHUB_SHA}"             -e FIREBASE_PROJECT_ID="$GCP_PROJECT_ID"             -e FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"             -p 18084:8080 "$NESTBALANCE_API_IMAGE"
          trap 'docker stop nestbalance-prod-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18084/healthz | grep -q '"ok":true'; then exit 0; fi
            sleep 1
          done
          docker logs nestbalance-prod-smoke
          exit 1

      - name: Push production image
        run: docker push "$NESTBALANCE_API_IMAGE"

      - name: Deploy production API
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ -n "${OPENAI_SECRET_NAME:-}" ]]; then
            EXTRA_ARGS+=(--set-secrets "OPENAI_API_KEY=${OPENAI_SECRET_NAME}:latest")
          fi
          gcloud run deploy "$NESTBALANCE_API_SERVICE"             --image "$NESTBALANCE_API_IMAGE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --service-account "$NESTBALANCE_RUNTIME_SERVICE_ACCOUNT"             --allow-unauthenticated             --port 8080             --memory 512Mi             --cpu 1             --concurrency 8             --min-instances 0             --max-instances 3             --timeout 60             --set-env-vars "NESTBALANCE_ENV=production,NESTBALANCE_RELEASE_SHA=${GITHUB_SHA},FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET,OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-5.6-luna},OPENAI_TRANSCRIBE_MODEL=${OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}"             "${EXTRA_ARGS[@]}"

      - name: Ensure production Hosting site
        shell: bash
        run: |
          set -euo pipefail
          npx firebase hosting:sites:list --project "$GCP_PROJECT_ID" --json > /tmp/prod-sites.json
          if ! grep -Fq "$FIREBASE_HOSTING_SITE" /tmp/prod-sites.json; then
            npx firebase hosting:sites:create "$FIREBASE_HOSTING_SITE" --project "$GCP_PROJECT_ID"
          fi
          npx firebase target:apply hosting nestbalance-production "$FIREBASE_HOSTING_SITE" --project "$GCP_PROJECT_ID"

      - name: Preserve and authorize production Auth domain
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HOST="$FIREBASE_HOSTING_SITE.web.app"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          CONFIG_URL="https://identitytoolkit.googleapis.com/admin/v2/projects/$GCP_PROJECT_ID/config"
          curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" "$CONFIG_URL" >/tmp/auth.json
          jq --arg domain "$AUTH_HOST" '{authorizedDomains: (((.authorizedDomains // []) + [$domain]) | unique)}' /tmp/auth.json >/tmp/auth-patch.json
          curl --fail --silent --show-error -X PATCH             -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json"             --data-binary @/tmp/auth-patch.json "$CONFIG_URL?updateMask=authorizedDomains" >/tmp/auth-updated.json
          jq -e --arg domain "$AUTH_HOST" '.authorizedDomains | index($domain) != null' /tmp/auth-updated.json >/dev/null

      - name: Deploy production Hosting only
        run: npx firebase deploy --only hosting:nestbalance-production --config firebase.production.json --project "$GCP_PROJECT_ID"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          HOSTING_URL="https://$FIREBASE_HOSTING_SITE.web.app"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors             "$HOSTING_URL/api/healthz" | tee /tmp/prod-health.json | grep -q '"ok":true'
          grep -q '"environment":"production"' /tmp/prod-health.json
          curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors             "$HOSTING_URL/" | grep -q 'NestBalance'
          echo "NESTBALANCE_PRODUCTION_URL=$HOSTING_URL"
