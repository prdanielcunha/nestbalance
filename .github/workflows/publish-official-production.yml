name: Publish NestBalance Official Production Site

on:
  push:
    branches:
      - production

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: nestbalance-official-production-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: millionsnest
      GCP_WIF_PROVIDER: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
      GCP_DEPLOY_SERVICE_ACCOUNT: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      FIREBASE_OFFICIAL_HOSTING_SITE: mn-nestbalance-555464791734
      NESTBALANCE_OFFICIAL_DOMAIN: nestbalance.millionsnest.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Require certified main promotion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=100

          read -r -a COMMIT_PARTS <<< "$(git rev-list --parents -n 1 HEAD)"
          if (( ${#COMMIT_PARTS[@]} < 3 )); then
            echo "::error::Production must be promoted through a merge from main; direct production commits are not deployable."
            exit 1
          fi

          PROMOTED_MAIN_SHA="${COMMIT_PARTS[2]}"
          if ! git merge-base --is-ancestor "$PROMOTED_MAIN_SHA" origin/main; then
            echo "::error::The promoted production parent is not part of main."
            exit 1
          fi

          PROD_TREE="$(git rev-parse 'HEAD^{tree}')"
          PROMOTED_TREE="$(git rev-parse "$PROMOTED_MAIN_SHA^{tree}")"
          if [[ "$PROD_TREE" != "$PROMOTED_TREE" ]]; then
            echo "::error::Production contains code beyond the promoted main tree."
            exit 1
          fi
          echo "NestBalance certified main promotion: PASS"

      - name: Wait for production API certification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            RUN_JSON="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml/runs?branch=production&event=push&per_page=30")"
            STATUS="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .status' <<<"$RUN_JSON" | head -n 1)"
            CONCLUSION="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha==$sha) | (.conclusion // "")' <<<"$RUN_JSON" | head -n 1)"
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "NestBalance production API certification: PASS"
                exit 0
              fi
              echo "::error::Deploy NestBalance Production finished with conclusion: ${CONCLUSION:-unknown}"
              exit 1
            fi
            echo "Waiting for production API certification for $GITHUB_SHA (attempt $attempt/120)..."
            sleep 15
          done
          echo "::error::Timed out waiting for Deploy NestBalance Production for $GITHUB_SHA."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build certified web bundle
        run: |
          npm run typecheck
          npm run build

      - name: Authenticate to MillionsNest GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Bind official Hosting target
        run: npx firebase target:apply hosting nestbalance-production-official "$FIREBASE_OFFICIAL_HOSTING_SITE" --project "$GCP_PROJECT_ID"

      - name: Publish official production site
        run: npx firebase deploy --only hosting:nestbalance-production-official --config firebase.production.official.json --project "$GCP_PROJECT_ID"

      - name: Verify official production endpoints
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://$FIREBASE_OFFICIAL_HOSTING_SITE.web.app"
          DOMAIN_URL="https://$NESTBALANCE_OFFICIAL_DOMAIN"

          wait_for_release() {
            local url="$1"
            local output="$2"
            for attempt in {1..60}; do
              if curl --fail --silent --show-error --location "$url/api/healthz" >"$output"; then
                if jq -e --arg sha "$GITHUB_SHA" '.ok == true and .environment == "production" and .release == $sha' "$output" >/dev/null; then
                  return 0
                fi
              fi
              sleep 5
            done
            cat "$output" || true
            return 1
          }

          wait_for_release "$SITE_URL" /tmp/site-health.json
          wait_for_release "$DOMAIN_URL" /tmp/domain-health.json

          curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors \
            --output /tmp/official-index.html "$DOMAIN_URL/"
          grep -q 'NestBalance' /tmp/official-index.html

          curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors \
            --output /tmp/official-sw.js "$DOMAIN_URL/sw.js"
          grep -Fq "url.pathname.startsWith('/api/')" /tmp/official-sw.js

          curl --fail --silent --show-error --head --output /tmp/official-sw-headers.txt "$DOMAIN_URL/sw.js"
          tr -d '\r' </tmp/official-sw-headers.txt | grep -Eqi '^cache-control:.*no-store'

          echo "NESTBALANCE_OFFICIAL_PRODUCTION_URL=$DOMAIN_URL"
