name: Generate NestBalance authenticated snapshots

on:
  push:
    branches:
      - codex/nestbalance-analysis-upgrades-20260923
    paths:
      - tests/e2e/authenticated-finance.spec.ts
      - .github/workflows/generate-authenticated-snapshots.yml

permissions:
  contents: write

concurrency:
  group: nestbalance-auth-snapshots
  cancel-in-progress: true

jobs:
  snapshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/nestbalance-analysis-upgrades-20260923
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build E2E web bundle
        env:
          NEXT_PUBLIC_NESTBALANCE_E2E: "true"
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate Linux Chromium baselines
        run: npx playwright test tests/e2e/authenticated-finance.spec.ts --project=desktop-chromium --update-snapshots
      - name: Commit snapshot baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots
          git diff --cached --quiet && exit 0
          git commit -m "test: add authenticated visual baselines"
          git pull --rebase origin codex/nestbalance-analysis-upgrades-20260923
          git push origin HEAD:codex/nestbalance-analysis-upgrades-20260923
