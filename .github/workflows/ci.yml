name: NestBalance CI

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

permissions:
  contents: read

concurrency:
  group: nestbalance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: nestbalance-package-lock
          path: package-lock.json
          retention-days: 2

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Core and static security gates
        run: npm run check

      - name: Firestore Rules emulator
        run: npm run test:rules

      - name: Authenticated API emulator flow
        run: npm run test:authenticated-api

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Build Cloud Run API
        run: npm run build:cloudrun
