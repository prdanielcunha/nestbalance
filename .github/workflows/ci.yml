name: NestBalance CI

on:
  push:
    branches:
      - main
      - production
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - production

permissions:
  contents: read

concurrency:
  group: nestbalance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Core and static security gates
        run: npm run check

      - name: Firestore Rules emulator
        run: npm run test:rules

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Build Cloud Run API
        run: npm run build:cloudrun
